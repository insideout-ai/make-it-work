name: Validate plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.267

      - name: Test dashboard renderer
        run: node --test skills/implement/scripts/render-status.test.mjs

      - name: Validate plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json --strict

      - name: Validate skills
        run: claude plugin validate skills --strict

      - name: Test plan Execution Status updater
        run: node --test skills/execute/scripts/plan-status.test.mjs

      - name: Validate eval inventory and fixture guards
        run: node evals/validate.mjs

      - name: Validate marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      - name: Test implement feedback writer
        run: node --test skills/implement/scripts/write-feedback.test.mjs

      - name: Test shared decision-log writer
        run: node --test scripts/decision-log.test.mjs
