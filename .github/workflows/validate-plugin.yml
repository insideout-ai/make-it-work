name: Validate plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.267

      - name: Test implement workflow helpers
        run: node --test skills/implement/scripts/*.test.mjs skills/execute/scripts/*.test.mjs scripts/*.test.mjs

      - name: Validate plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json --strict

      - name: Validate skills
        run: claude plugin validate skills --strict

      - name: Validate eval inventory and fixture guards
        run: node evals/validate.mjs

      - name: Test automatic headless grading and eval batching
        run: node --test evals/*.test.mjs

      - name: Validate marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json --strict
